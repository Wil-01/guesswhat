<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuessWhat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="room-header">
    <h1><a href="/">GuessWhat</a></h1>
    <div class="room-code">
      Room <strong id="room-code"></strong>
      <button id="copy-link" type="button">Copier le lien</button>
    </div>
  </header>
  <p id="closed" class="closed" hidden>
    Connexion terminée. <a href="/">Retour au lobby</a>
  </p>
  <form id="nickname-form">
    <label for="nickname">Pseudo</label>
    <input id="nickname" type="text" autocomplete="off" maxlength="20">
    <button type="submit">Changer</button>
  </form>
  <main class="game">
    <aside class="players">
      <h2>Joueurs</h2>
      <ul id="players"></ul>
      <label class="theme-picker">Thème
        <select id="theme" disabled>
          <option value="">Tous les thèmes</option>
        </select>
      </label>
      <button id="start" type="button" hidden>Start</button>
    </aside>
    <section class="board">
      <div class="round-info">
        <span id="round" class="round" hidden></span>
        <span id="round-theme" class="round" hidden></span>
        <span id="word" class="word" hidden></span>
        <span id="timer" class="timer" hidden></span>
      </div>
      <div id="toolbar" class="toolbar">
        <input id="color" type="color" value="#000000" aria-label="Couleur">
        <input id="size" type="range" min="1" max="50" value="4" aria-label="Épaisseur">
        <button id="clear" type="button">Effacer</button>
      </div>
      <canvas id="canvas" width="800" height="600"></canvas>
    </section>
    <section class="chat">
      <ul id="messages"></ul>
      <form id="form">
        <input id="input" type="text" autocomplete="off" placeholder="Type your message...">
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <dialog id="results">
    <h2>Résultats</h2>
    <ol id="ranking"></ol>
    <a class="button" href="/">Retour au lobby</a>
  </dialog>

  <template id="player-template">
    <li class="player">
      <span class="name"></span>
      <span class="badges"></span>
      <span class="score"></span>
    </li>
  </template>

  <template id="rank-template">
    <li>
      <span class="name"></span>
      <span class="score"></span>
    </li>
  </template>

  <script src="app.js"></script>
  <script src="canvas.js"></script>
  <script src="game.js"></script>
</body>
</html>
