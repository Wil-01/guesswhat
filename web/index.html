<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuessWhat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lobby">
  <h1>GuessWhat</h1>

  <section class="card">
    <label for="nickname">Pseudo</label>
    <input id="nickname" type="text" autocomplete="off" maxlength="20" placeholder="guest">
  </section>

  <section class="card">
    <h2>Créer une room</h2>
    <label class="inline">Thème
      <select id="theme">
        <option value="">Tous les thèmes</option>
      </select>
    </label>
    <label class="inline"><input id="private" type="checkbox"> Room privée</label>
    <button id="create" type="button">Créer</button>
    <p id="create-error" class="error" hidden></p>
  </section>

  <section class="card">
    <h2>Rejoindre avec un code</h2>
    <form id="join-form" class="row">
      <input id="code" type="text" autocomplete="off" maxlength="5" placeholder="ABCDE">
      <button type="submit">Rejoindre</button>
    </form>
  </section>

  <section class="card">
    <div class="row">
      <h2>Rooms publiques</h2>
      <button id="refresh" type="button" aria-label="Rafraîchir">↻</button>
    </div>
    <ul id="rooms"></ul>
    <p id="no-rooms" hidden>Aucune room publique pour le moment.</p>
  </section>

  <template id="room-template">
    <li>
      <a class="room-link">
        <span class="code"></span>
        <span class="meta"></span>
      </a>
    </li>
  </template>

  <script src="lobby.js"></script>
</body>
</html>
