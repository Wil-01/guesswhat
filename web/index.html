<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuessWhat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GuessWhat</h1>
  <form id="nickname-form">
    <label for="nickname">Pseudo</label>
    <input id="nickname" type="text" autocomplete="off" maxlength="20">
    <button type="submit">Changer</button>
  </form>
  <main class="game">
    <aside class="players">
      <h2>Joueurs</h2>
      <ul id="players"></ul>
      <button id="start" type="button" hidden>Start</button>
    </aside>
    <section class="board">
      <div id="word" class="word" hidden></div>
      <div id="toolbar" class="toolbar">
        <input id="color" type="color" value="#000000" aria-label="Couleur">
        <input id="size" type="range" min="1" max="50" value="4" aria-label="Épaisseur">
        <button id="clear" type="button">Effacer</button>
      </div>
      <canvas id="canvas" width="800" height="600"></canvas>
    </section>
    <section class="chat">
      <ul id="messages"></ul>
      <form id="form">
        <input id="input" type="text" autocomplete="off" placeholder="Type your message...">
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <template id="player-template">
    <li class="player">
      <span class="name"></span>
      <span class="badges"></span>
    </li>
  </template>

  <script src="app.js"></script>
  <script src="canvas.js"></script>
  <script src="game.js"></script>
</body>
</html>
