<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuessWhat</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="lobby">
  <header class="site-header">
    <div>
      <h1 class="logo-mark">GuessWhat</h1>
      <p class="tagline">Dessine, devine, gagne.</p>
    </div>
    <button id="theme-toggle" class="icon-button" type="button"></button>
  </header>

  <section class="card">
    <label for="nickname">Pseudo</label>
    <input id="nickname" type="text" autocomplete="off" maxlength="20" placeholder="guest">
    <div id="avatar-editor" class="avatar-editor"></div>
  </section>

  <section class="card">
    <h2>Créer une room</h2>
    <label class="inline">Thème
      <select id="theme">
        <option value="">Tous les thèmes</option>
      </select>
    </label>
    <div class="row inline">
      <label>Manches
        <input id="rounds" type="number" min="1" max="10" value="3">
      </label>
      <label>Durée
        <select id="duration">
          <option value="30">30 s</option>
          <option value="45">45 s</option>
          <option value="60">60 s</option>
          <option value="80" selected>80 s</option>
          <option value="100">100 s</option>
          <option value="120">120 s</option>
          <option value="150">150 s</option>
          <option value="180">180 s</option>
        </select>
      </label>
    </div>
    <label class="inline"><input id="teams" type="checkbox"> Équipe contre équipe</label>
    <label class="inline"><input id="private" type="checkbox"> Room privée</label>
    <button id="create" type="button">Créer</button>
    <p id="create-error" class="error" hidden></p>
  </section>

  <section class="card">
    <h2>Rejoindre avec un code</h2>
    <form id="join-form" class="row">
      <input id="code" type="text" autocomplete="off" maxlength="5" placeholder="ABCDE">
      <button type="submit">Rejoindre</button>
    </form>
  </section>

  <section class="card">
    <div class="row">
      <h2>Rooms publiques</h2>
      <button id="refresh" type="button" aria-label="Rafraîchir">↻</button>
    </div>
    <ul id="rooms"></ul>
    <p id="no-rooms" hidden>Aucune room publique pour le moment.</p>
  </section>

  <p class="lobby-footer"><a href="/admin.html">Administration des mots</a></p>

  <template id="room-template">
    <li>
      <a class="room-link">
        <span class="code"></span>
        <span class="meta"></span>
      </a>
    </li>
  </template>

  <script src="avatar.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
